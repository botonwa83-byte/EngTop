name: EngTopApp
options:
  bundleIdPrefix: com.engtopapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: zh-Hans
schemes:
  EngTopApp:
    build:
      targets:
        EngTopApp: all
    run:
      storeKitConfiguration: EngTopApp.storekit
    test:
      storeKitConfiguration: EngTopApp.storekit
      targets:
        - EngTopAppTests
    profile:
      storeKitConfiguration: EngTopApp.storekit
targets:
  EngTopAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EngTopAppTests
    dependencies:
      - target: EngTopApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EngTopApp:
    type: application
    platform: iOS
    sources:
      - path: EngTopApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engtopapp.app
        PRODUCT_NAME: EngTopApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EngTopApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
